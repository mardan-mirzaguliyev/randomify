# Render Blueprint — https://render.com/docs/blueprint-spec
# Connect repo, add MONGODB_URI + JWT secrets in the dashboard (see DEPLOY.md).

services:
  - type: web
    name: randomify
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
